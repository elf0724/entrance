<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理｜政策研究資料庫</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: "微軟正黑體","Microsoft JhengHei","Noto Sans TC",sans-serif; }
  .sidebar { width:220px; min-height:100vh; background:#1e3a5f; }
  .sidebar a { display:block; padding:9px 16px; color:#c8d8f0; border-radius:6px; margin:2px 8px; font-size:13px; cursor:pointer; transition:background .15s; }
  .sidebar a:hover,.sidebar a.active { background:#2e5e99; color:#fff; }
  .sheet-btn { padding:6px 14px; border-radius:6px 6px 0 0; font-size:12px; border:1px solid #d1d5db; border-bottom:none; background:#f9fafb; cursor:pointer; }
  .sheet-btn.active { background:#fff; color:#1e3a5f; font-weight:700; border-top:2px solid #2e5e99; }
  textarea.cell-edit { width:100%; min-height:60px; border:1px solid #93c5fd; border-radius:4px; padding:4px 6px; font-size:11px; resize:vertical; font-family:inherit; }
  input.cell-edit { width:100%; border:1px solid #93c5fd; border-radius:4px; padding:3px 6px; font-size:11px; font-family:inherit; }
  td { padding:6px 8px; font-size:11px; border-bottom:1px solid #e5e7eb; vertical-align:top; }
  th { position:sticky; top:0; background:#1e3a5f; color:#fff; padding:8px 10px; font-size:11px; white-space:nowrap; z-index:10; }
  .toast { position:fixed; bottom:24px; right:24px; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:600; z-index:999; display:none; }
  .toast.ok  { background:#166534; color:#fff; }
  .toast.err { background:#991b1b; color:#fff; }
</style>
</head>
<body class="bg-gray-100">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <div class="sidebar flex flex-col flex-shrink-0 pt-4">
    <div class="px-4 pb-4 border-b border-blue-800">
      <div class="text-white font-bold text-sm">⚙️ 後台管理</div>
      <div class="text-blue-300 text-xs mt-0.5">Admin Panel</div>
    </div>
    <div class="mt-3 px-2 text-xs text-blue-400 font-semibold tracking-wider pl-4 mb-1">議題資料</div>
    <div id="topicNav"></div>
    <div class="mt-3 px-2 text-xs text-blue-400 font-semibold tracking-wider pl-4 mb-1">圖表設定</div>
    <div id="chartConfigNav"></div>
    <div class="flex-1"></div>
    <div class="px-4 py-3 border-t border-blue-800 space-y-2">
      <a href="/" class="text-blue-300 text-xs hover:text-white">← 回主網站</a>
    </div>
  </div>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top bar -->
    <div class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3 flex-wrap">
      <div id="pageTitle" class="font-bold text-gray-700 text-base flex-1">請選擇議題</div>
      <button id="addRowBtn" onclick="addRow()" class="hidden text-sm bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded-lg font-semibold">＋ 新增列</button>
      <button id="saveBtn" onclick="saveSheet()" class="hidden text-sm bg-blue-700 hover:bg-blue-800 text-white px-4 py-1.5 rounded-lg font-semibold">💾 儲存資料</button>
      <button id="saveChartBtn" onclick="saveChartConfig()" class="hidden text-sm bg-purple-700 hover:bg-purple-800 text-white px-4 py-1.5 rounded-lg font-semibold">💾 儲存圖表設定</button>
      <span id="dirtyBadge" class="hidden text-xs text-amber-600 font-semibold">● 有未儲存的變更</span>
    </div>

    <!-- Sheet tabs -->
    <div class="bg-white border-b border-gray-200 px-6 pt-2 flex gap-1" id="sheetTabs"></div>

    <!-- Table area -->
    <div class="flex-1 overflow-auto px-4 pt-3 pb-6" id="tableArea">
      <div class="text-center text-gray-400 mt-20 text-base">請從左側選擇議題</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let topics = [], currentTopicData = null, currentSheetIdx = 0;
let dirtyRows = new Set(); // 有改動的列 index

// ── 初始化 ────────────────────────────────────────────────────────
async function init() {
  const res = await fetch('/api/topics');
  topics = await res.json();
  const nav = document.getElementById('topicNav');
  nav.innerHTML = '';
  topics.forEach(t => {
    const a = document.createElement('a');
    a.textContent = t.label;
    a.onclick = () => loadTopic(t.id);
    nav.appendChild(a);
  });
}

async function loadTopic(id) {
  if (dirtyRows.size > 0 && !confirm('有未儲存的變更，確定要切換議題嗎？')) return;
  dirtyRows.clear();
  document.querySelectorAll('#topicNav a').forEach(a => {
    a.classList.toggle('active', a.textContent === topics.find(t=>t.id===id)?.label);
  });
  const res = await fetch(`/api/topic/${id}`);
  currentTopicData = await res.json();
  currentSheetIdx = 0;
  renderSheetTabs();
  renderTable();
  document.getElementById('pageTitle').textContent = currentTopicData.label + ' — 後台編輯';
  document.getElementById('addRowBtn').classList.remove('hidden');
  document.getElementById('saveBtn').classList.remove('hidden');
}

// ── Sheet Tabs ────────────────────────────────────────────────────
function renderSheetTabs() {
  const tabs = document.getElementById('sheetTabs');
  tabs.innerHTML = currentTopicData.sheets.map((s,i) =>
    `<button class="sheet-btn ${i===currentSheetIdx?'active':''}" onclick="switchSheet(${i})">
      ${s.name} <span class="text-gray-400 font-normal">(${s.rows.length})</span>
    </button>`
  ).join('');
}

function switchSheet(i) {
  if (dirtyRows.size > 0 && !confirm('有未儲存的變更，確定要切換分頁嗎？')) return;
  dirtyRows.clear();
  updateDirtyBadge();
  currentSheetIdx = i;
  renderSheetTabs();
  renderTable();
}

function currentSheet() { return currentTopicData.sheets[currentSheetIdx]; }

// ── Table ─────────────────────────────────────────────────────────
function renderTable() {
  const sheet = currentSheet();
  const cols = sheet.columns.filter(c => !c.startsWith('_') && c !== '來源連結+查核');
  const area = document.getElementById('tableArea');

  let html = `<div class="overflow-x-auto"><table class="w-full border-collapse bg-white rounded-lg shadow-sm">
    <thead><tr>
      <th style="width:40px">#</th>
      ${cols.map(c => `<th>${escH(c)}</th>`).join('')}
      <th style="width:80px">操作</th>
    </tr></thead><tbody id="tbody">`;

  sheet.rows.forEach((row, i) => {
    html += renderRow(row, i, cols);
  });

  html += '</tbody></table></div>';
  area.innerHTML = html;

  // HTML 插入後，統一用 DOM 把值填入 input（避免 HTML 轉義問題）
  sheet.rows.forEach((row, i) => {
    cols.forEach(c => {
      const el = document.querySelector(`.cell-edit[data-row="${i}"][data-col="${CSS.escape(c)}"]`);
      if (el && el.tagName === 'INPUT') el.value = row[c] || '';
    });
  });
}

function renderRow(row, i, cols) {
  const colsToUse = cols || currentSheet().columns.filter(c => !c.startsWith('_') && c !== '來源連結+查核');
  return `<tr id="row-${i}" class="${dirtyRows.has(i) ? 'bg-amber-50' : ''}">
    <td class="text-gray-400 text-center">${i + 1}</td>
    ${colsToUse.map(c => {
      const isLong = (row[c] || '').length > 60 || (row[c] || '').includes('\n');
      if (isLong) {
        return `<td><textarea class="cell-edit" data-row="${i}" data-col="${escH(c)}"
          oninput="markDirty(${i})">${escH(row[c] || '')}</textarea></td>`;
      } else {
        // input：值在 renderTable 裡用 DOM 填入，這裡只建結構
        return `<td><input type="text" class="cell-edit" data-row="${i}" data-col="${escH(c)}"
          oninput="markDirty(${i})"></td>`;
      }
    }).join('')}
    <td class="text-center">
      <button onclick="deleteRow(${i})" class="text-red-500 hover:text-red-700 text-xs font-semibold px-2 py-1 rounded hover:bg-red-50">🗑 刪除</button>
    </td>
  </tr>`;
}

function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function markDirty(rowIdx) {
  dirtyRows.add(rowIdx);
  updateDirtyBadge();
  const tr = document.getElementById(`row-${rowIdx}`);
  if (tr) tr.classList.add('bg-amber-50');
}

function updateDirtyBadge() {
  document.getElementById('dirtyBadge').classList.toggle('hidden', dirtyRows.size === 0);
}

// ── 新增列 ────────────────────────────────────────────────────────
function addRow() {
  const sheet = currentSheet();
  const emptyRow = {};
  sheet.columns.forEach(c => { emptyRow[c] = ''; });
  emptyRow['_id'] = sheet.rows.length;
  sheet.rows.push(emptyRow);
  renderSheetTabs();
  renderTable();
  // 捲到最底
  setTimeout(() => {
    const area = document.getElementById('tableArea');
    area.scrollTop = area.scrollHeight;
  }, 50);
  markDirty(sheet.rows.length - 1);
}

// ── 刪除列 ────────────────────────────────────────────────────────
function deleteRow(i) {
  if (!confirm(`確定刪除第 ${i+1} 列嗎？`)) return;
  const sheet = currentSheet();
  sheet.rows.splice(i, 1);
  dirtyRows.clear();
  renderSheetTabs();
  renderTable();
  markDirty(-1); // 標記有變更但不高亮特定列
  dirtyRows.add(0); // 確保 badge 顯示
  updateDirtyBadge();
}

// ── 儲存 ──────────────────────────────────────────────────────────
async function saveSheet() {
  // 把畫面上的輸入值讀回 data
  const sheet = currentSheet();
  const cols = sheet.columns.filter(c => !c.startsWith('_') && c !== '來源連結+查核');
  document.querySelectorAll('.cell-edit').forEach(el => {
    const ri = parseInt(el.dataset.row);
    const col = el.dataset.col;
    if (ri < sheet.rows.length) {
      sheet.rows[ri][col] = el.value;
    }
  });

  try {
    const res = await fetch(`/api/topic/${currentTopicData.id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentTopicData)
    });
    const result = await res.json();
    if (result.ok) {
      dirtyRows.clear();
      updateDirtyBadge();
      // 移除所有 amber 高亮
      document.querySelectorAll('tr[id^="row-"]').forEach(tr => tr.classList.remove('bg-amber-50'));
      showToast('✅ 已儲存！', 'ok');
    } else {
      showToast('❌ 儲存失敗', 'err');
    }
  } catch(e) {
    showToast('❌ 無法連線到伺服器', 'err');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type}`;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

// ══════════════════════════════════════════════════════════════════
// 圖表設定編輯
// ══════════════════════════════════════════════════════════════════
let chartConfigs = {}, currentChartTopic = null;

async function loadChartConfigs() {
  const res = await fetch('/api/chart_configs');
  chartConfigs = await res.json();
  const nav = document.getElementById('chartConfigNav');
  nav.innerHTML = Object.keys(chartConfigs).map(tid =>
    `<a onclick="editChartConfig('${tid}')">${tid} 圖表</a>`
  ).join('');
}

function editChartConfig(tid) {
  currentChartTopic = tid;
  const cfg = chartConfigs[tid];
  document.querySelectorAll('#chartConfigNav a').forEach(a =>
    a.classList.toggle('active', a.textContent.startsWith(tid)));
  document.querySelectorAll('#topicNav a').forEach(a => a.classList.remove('active'));

  // 隱藏資料列按鈕，顯示圖表儲存按鈕
  document.getElementById('addRowBtn').classList.add('hidden');
  document.getElementById('saveBtn').classList.add('hidden');
  document.getElementById('saveChartBtn').classList.remove('hidden');
  document.getElementById('dirtyBadge').classList.add('hidden');
  document.getElementById('sheetTabs').innerHTML = '';
  document.getElementById('pageTitle').textContent = `${tid} — 圖表設定`;

  renderChartConfigEditor(tid, cfg);
}

function renderChartConfigEditor(tid, cfg) {
  const area = document.getElementById('tableArea');

  // ① twPolicies 列表
  const polRows = cfg.twPolicies.map((p, pi) =>
    `<tr>
       <td class="text-gray-400 text-center text-xs">${pi + 1}</td>
       <td><input type="text" class="cell-edit tw-policy" data-pi="${pi}"
         value="" style="min-width:160px"></td>
       <td class="text-center">
         <button onclick="removeTwPolicy(${pi})" class="text-red-400 hover:text-red-600 text-xs">✕</button>
       </td>
     </tr>`
  ).join('');

  // ② twMatrix — 政策(列) × 族群(欄) 的格子
  const groupHeaders = cfg.groups.map(g =>
    `<th style="font-size:9px;writing-mode:vertical-rl;height:72px;padding:4px 6px;white-space:nowrap">${g.short}</th>`
  ).join('');

  const matrixRows = cfg.twPolicies.map((pol, pi) =>
    `<tr>
       <td class="text-xs font-semibold text-gray-700 whitespace-nowrap pr-2">${pol}</td>
       ${cfg.groups.map((g, gi) => {
         const v = (cfg.twMatrix[pi] || [])[gi] ?? 0;
         return `<td class="p-0 text-center">
           <select class="tw-matrix-cell text-xs border-0 w-full text-center cursor-pointer"
             data-pi="${pi}" data-gi="${gi}"
             style="background:${['#f9fafb','#dbeafe','#93c5fd','#1d4ed8'][v]};color:${v===3?'white':'#1e3a5f'}">
             <option value="0" ${v===0?'selected':''}>—</option>
             <option value="1" ${v===1?'selected':''}>間</option>
             <option value="2" ${v===2?'selected':''}>部分</option>
             <option value="3" ${v===3?'selected':''}>高度</option>
           </select>
         </td>`;
       }).join('')}
     </tr>`
  ).join('');

  // ③ intlDims 列表
  const dimRows = cfg.intlDims.map((d, di) =>
    `<tr>
       <td class="text-gray-400 text-center text-xs">${di + 1}</td>
       <td><input type="text" class="cell-edit intl-dim" data-di="${di}"
         value="" style="min-width:140px"></td>
       <td class="text-center">
         <button onclick="removeIntlDim(${di})" class="text-red-400 hover:text-red-600 text-xs">✕</button>
       </td>
     </tr>`
  ).join('');

  area.innerHTML = `
    <div class="space-y-6 pb-10 max-w-5xl">

      <!-- twPolicies -->
      <div class="bg-white rounded-xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-3">
          <div class="font-bold text-gray-800">① 台灣政策清單（矩陣列名）</div>
          <button onclick="addTwPolicy()" class="text-xs bg-green-600 text-white px-3 py-1 rounded-lg">＋ 新增政策</button>
        </div>
        <table class="w-full"><thead><tr>
          <th class="w-8">#</th><th>政策名稱</th><th class="w-10">刪除</th>
        </tr></thead><tbody id="twPolicyBody">${polRows}</tbody></table>
      </div>

      <!-- twMatrix -->
      <div class="bg-white rounded-xl shadow-sm p-5">
        <div class="font-bold text-gray-800 mb-1">② 台灣政策 × 族群 覆蓋矩陣</div>
        <div class="text-xs text-gray-500 mb-3">—=無　間=間接　部分=部分覆蓋　高度=高度覆蓋；點下拉選單直接改值</div>
        <div class="overflow-x-auto">
          <table class="border-collapse">
            <thead><tr>
              <th class="text-left text-xs pr-3" style="min-width:120px">政策 \\ 族群</th>
              ${groupHeaders}
            </tr></thead>
            <tbody id="twMatrixBody">${matrixRows}</tbody>
          </table>
        </div>
      </div>

      <!-- intlDims -->
      <div class="bg-white rounded-xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-3">
          <div>
            <div class="font-bold text-gray-800">③ 國際面向標籤</div>
            <div class="text-xs text-gray-500 mt-0.5">用於國際對應圖的雷達軸線與矩陣欄名（城市資料已從 JSON 自動產生）</div>
          </div>
          <button onclick="addIntlDim()" class="text-xs bg-green-600 text-white px-3 py-1 rounded-lg">＋ 新增面向</button>
        </div>
        <table class="w-full"><thead><tr>
          <th class="w-8">#</th><th>面向名稱</th><th class="w-10">刪除</th>
        </tr></thead><tbody id="intlDimBody">${dimRows}</tbody></table>
      </div>

    </div>`;

  // 填入 input 值（DOM 操作，避免特殊字元問題）
  cfg.twPolicies.forEach((p, pi) => {
    const el = document.querySelector(`.tw-policy[data-pi="${pi}"]`);
    if (el) el.value = p;
  });
  cfg.intlDims.forEach((d, di) => {
    const el = document.querySelector(`.intl-dim[data-di="${di}"]`);
    if (el) el.value = d;
  });

  // 矩陣下拉改色
  document.querySelectorAll('.tw-matrix-cell').forEach(sel => {
    sel.addEventListener('change', function() {
      const v = parseInt(this.value);
      this.style.background = ['#f9fafb','#dbeafe','#93c5fd','#1d4ed8'][v];
      this.style.color = v === 3 ? 'white' : '#1e3a5f';
    });
  });
}

// ── 台灣政策清單操作 ─────────────────────────────────────────────
function addTwPolicy() {
  const cfg = chartConfigs[currentChartTopic];
  cfg.twPolicies.push('新政策');
  cfg.twMatrix.push(new Array(cfg.groups.length).fill(0));
  renderChartConfigEditor(currentChartTopic, cfg);
}
function removeTwPolicy(pi) {
  if (!confirm(`確定刪除第 ${pi+1} 個政策嗎？`)) return;
  const cfg = chartConfigs[currentChartTopic];
  cfg.twPolicies.splice(pi, 1);
  cfg.twMatrix.splice(pi, 1);
  renderChartConfigEditor(currentChartTopic, cfg);
}

// ── 國際面向操作 ────────────────────────────────────────────────
function addIntlDim() {
  chartConfigs[currentChartTopic].intlDims.push('新面向');
  renderChartConfigEditor(currentChartTopic, chartConfigs[currentChartTopic]);
}
function removeIntlDim(di) {
  if (!confirm(`確定刪除第 ${di+1} 個面向嗎？`)) return;
  chartConfigs[currentChartTopic].intlDims.splice(di, 1);
  renderChartConfigEditor(currentChartTopic, chartConfigs[currentChartTopic]);
}

// ── 儲存圖表設定 ────────────────────────────────────────────────
async function saveChartConfig() {
  const cfg = chartConfigs[currentChartTopic];

  // 讀取 twPolicies
  document.querySelectorAll('.tw-policy').forEach(el => {
    const pi = parseInt(el.dataset.pi);
    if (pi < cfg.twPolicies.length) cfg.twPolicies[pi] = el.value.trim();
  });
  // 讀取 twMatrix
  document.querySelectorAll('.tw-matrix-cell').forEach(sel => {
    const pi = parseInt(sel.dataset.pi), gi = parseInt(sel.dataset.gi);
    if (!cfg.twMatrix[pi]) cfg.twMatrix[pi] = [];
    cfg.twMatrix[pi][gi] = parseInt(sel.value);
  });
  // 讀取 intlDims
  document.querySelectorAll('.intl-dim').forEach(el => {
    const di = parseInt(el.dataset.di);
    if (di < cfg.intlDims.length) cfg.intlDims[di] = el.value.trim();
  });

  try {
    const res = await fetch('/api/chart_configs', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(chartConfigs)
    });
    const result = await res.json();
    showToast(result.ok ? '✅ 圖表設定已儲存！' : '❌ 儲存失敗', result.ok ? 'ok' : 'err');
  } catch(e) {
    showToast('❌ 無法連線到伺服器', 'err');
  }
}

init();
loadChartConfigs();
</script>
</body>
</html>
