<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 氣象預測專家</title>
  
  <!-- 1. 引入 Tailwind CSS (負責所有美美的排版與顏色) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. 引入 React 核心函式庫 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 3. 引入 Babel (負責在瀏覽器內即時將 JSX 翻譯成標準 JS) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 4. 引入 Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  
  <!-- React 應用程式的掛載點 -->
  <div id="root"></div>

  <!-- 💡 錯誤捕捉機制：防止記事本編碼錯誤或複製不完整導致的「全白畫面」 -->
  <script>
    window.addEventListener('error', function(event) {
      const root = document.getElementById('root');
      if (root && root.innerHTML === '') {
        root.innerHTML = '<div style="padding:30px; color:#b91c1c; font-family:sans-serif; background:#fef2f2; height:100vh;">' +
          '<h2 style="font-size:24px; font-weight:bold; margin-bottom:10px;">系統載入失敗 💥</h2>' +
          '<p style="margin-bottom:10px;">錯誤訊息：' + event.message + '</p>' +
          '<p style="font-weight:bold; margin-top:20px;">【常見解決方案】</p>' +
          '<ol style="line-height:1.8;">' +
          '<li>請確認您使用 Windows 記事本另存新檔時，最下方的「編碼」是否已選擇 <strong>UTF-8</strong>。</li>' +
          '<li>請確認程式碼從頭到尾都有完整複製到。</li>' +
          '</ol></div>';
      }
    });

    const originalConsoleError = console.error;
    console.error = function(...args) {
      const root = document.getElementById('root');
      if (root && root.innerHTML === '') {
        root.innerHTML = '<div style="padding:30px; color:#b91c1c; font-family:sans-serif; background:#fef2f2; height:100vh;">' +
          '<h2 style="font-size:24px; font-weight:bold; margin-bottom:10px;">編譯發生錯誤 💥</h2>' +
          '<p style="margin-bottom:10px;">請確保程式碼複製完整，且存檔編碼為 UTF-8。</p>' +
          '<p style="font-size:12px; color:#7f1d1d; background:#fee2e2; padding:10px; border-radius:8px;">' + args.join(' ') + '</p></div>';
      }
      originalConsoleError.apply(console, args);
    };
  </script>

  <!-- 我們的 React 程式碼寫在這裡，type 必須標記為 text/babel 讓 Babel 來翻譯 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 系統預設金鑰 (這裡預設留空，交給介面讓您自行輸入) ---
    const apiKey = ""; 

    // --- 處理圖示轉換的輔助元件 (加入防呆機制避免崩潰) ---
    const Icon = ({ name, className }) => {
      try {
        let iconName = name;
        if (name === 'Loader2') iconName = 'LoaderCircle';
        if (name === 'CheckCircle2') iconName = 'CheckCircle';
        if (name === 'AlertTriangle') iconName = 'TriangleAlert';

        const icons = window.lucide && window.lucide.icons ? window.lucide.icons : null;
        if (!icons) return <span className={className}></span>;

        const iconObj = icons[iconName] || icons[name];
        if (iconObj) {
          const svgHTML = iconObj.toSvg({ class: className });
          return <span className={`inline-flex items-center justify-center ${className || ''}`} dangerouslySetInnerHTML={{ __html: svgHTML }} />;
        }
        return <span className={className}></span>;
      } catch (e) {
        return <span className={className}></span>;
      }
    };

    // --- System Prompt ---
    const systemPrompt = `您是一位專業的『氣象預測專家』。您的目標是分析氣象數據，特別是針對攝影愛好者關心的低空雲海與平流霧現象，提供精確的預測資訊。

    角色定位與目標：
    *作為攝影愛好者的資深氣象顧問，綜合判讀多方氣象資訊來源（如中央氣象署、Windy、NCDR/ECMWF等），為使用者提供特定時間與地點的詳細氣象分析。
    *特別專注於評估低空雲海及低層平流霧的發生機率，協助用戶掌握最佳拍攝時機。
    *將複雜的氣象科學數據轉化為淺顯易懂、具操作性的攝影建議。

    核心行為準則：
    1) 資訊搜集與多源整合：優先分析氣象條件、衛星雲圖趨勢、濕度、風速及溫差數據。分析逆溫層。
    2) 攝影專業分析重點：深度分析水氣含量、逆溫層高度及風力條件。針對攝影需求，提供預估的能見度建議。
    3) 結果呈現：請根據提供給您的 JSON Schema，將您的預測結果填寫進嚴格的 JSON 格式中回傳。絕對不要包含 markdown 標籤 (如 \`\`\`json) 或多餘的文字，只回傳純 JSON 格式字串。`;

    const defaultData = {
      summary: "請在左側選擇您預計拍攝的日期、時間與地點，系統將啟動氣象預測專家 AI 引擎，為您分析低空雲海與平流霧的發生機率。",
      tableData: [],
      analysis: [],
      suggestions: [],
      tips: ["冷暖空氣交會時最容易出現雲海大景，請記得做好保暖與相機鏡頭的除霧措施。"]
    };

    // --- 主要 App 元件 ---
    function App() {
      const [userApiKey, setUserApiKey] = useState('');
      const [showApiSettings, setShowApiSettings] = useState(false);
      
      const [selectedDates, setSelectedDates] = useState([]);
      const [dateInput, setDateInput] = useState('');
      const [selectedTimes, setSelectedTimes] = useState(['sunrise']);
      const [selectedLocs, setSelectedLocs] = useState(['jiufen']);
      const [customLoc, setCustomLoc] = useState('');
      
      const [isPredicting, setIsPredicting] = useState(false);
      const [showResults, setShowResults] = useState(false);
      const [predictionData, setPredictionData] = useState(defaultData);
      const [errorMsg, setErrorMsg] = useState('');
      const [authExpired, setAuthExpired] = useState(false);

      const timeOptions = [
        { id: 'sunrise', label: '日出前一小時', iconName: 'Sunrise' },
        { id: 'sunset', label: '日落後一小時', iconName: 'Sunset' }
      ];

      const locOptions = [
        { id: 'yangming', label: '陽明山區' },
        { id: 'jiufen', label: '九份/不厭亭' },
        { id: 'wufenshan', label: '五分山雷達站' },
        { id: 'pinglin', label: '坪林南山寺' }
      ];

      const getLocLabel = (id) => locOptions.find(l => l.id === id)?.label || id;
      const getTimeLabel = (id) => timeOptions.find(t => t.id === id)?.label || id;

      const toggleArrayItem = (array, setArray, item) => {
        if (array.includes(item)) {
          setArray(array.filter(i => i !== item));
        } else {
          setArray([...array, item]);
        }
      };

      const handleAddDate = () => {
        if (dateInput && !selectedDates.includes(dateInput)) {
          setSelectedDates([...selectedDates, dateInput].sort());
          setDateInput('');
        }
      };

      const handleRemoveDate = (dateToRemove) => {
        setSelectedDates(selectedDates.filter(date => date !== dateToRemove));
      };

      const fetchGeminiPrediction = async (userQuery, retryCount = 0) => {
        const maxRetries = 5;
        const delays = [1000, 2000, 4000, 8000, 16000];
        
        const isCustomKey = userApiKey.trim() !== '';
        // 如果是在 GitHub Pages 上，一定必須要填寫自己的 Key
        const effectiveApiKey = isCustomKey ? userApiKey.trim() : apiKey;
        
        if (!effectiveApiKey) {
            throw new Error('MISSING_KEY');
        }

        const modelName = "gemini-2.0-flash";

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                summary: { type: "STRING" },
                tableData: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      time: { type: "STRING" },
                      location: { type: "STRING" },
                      probability: { type: "NUMBER" }, 
                      note: { type: "STRING" }
                    }
                  }
                },
                analysis: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      title: { type: "STRING" },
                      content: { type: "STRING" }
                    }
                  }
                },
                suggestions: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      loc: { type: "STRING" },
                      alt: { type: "STRING" },
                      time: { type: "STRING" },
                      desc: { type: "STRING" }
                    }
                  }
                },
                tips: {
                  type: "ARRAY",
                  items: { type: "STRING" }
                }
              },
              required: ["summary", "tableData", "analysis", "suggestions", "tips"]
            }
          }
        };

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${effectiveApiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }
          );

          if (!response.ok) {
            if (response.status === 429) throw new Error('ERROR_429');
            if (response.status === 400) throw new Error('API 金鑰無效或格式錯誤 (400)');
            if (response.status === 401 || response.status === 403) throw new Error('AUTH_EXPIRED'); 
            throw new Error(`API 錯誤狀態碼: ${response.status}`);
          }
          
          const result = await response.json();
          if (result.error) throw new Error(`API 錯誤: ${result.error.message}`);

          const parts = result.candidates?.[0]?.content?.parts;
          const textResponse = parts?.find(p => p.text)?.text;
          
          if (!textResponse) throw new Error('API 回傳格式異常: 未取得文字回應');
          
          try {
            const cleanText = textResponse.replace(/```json/gi, '').replace(/```/g, '').trim();
            return JSON.parse(cleanText);
          } catch (parseError) {
            throw new Error('API 回傳格式異常: 無法解析 JSON');
          }
          
        } catch (error) {
          if (error.message === 'AUTH_EXPIRED' || error.message === 'ERROR_429' || error.message === 'MISSING_KEY' || error.message.includes('400')) {
            throw error;
          }
          if (retryCount < maxRetries) {
            await new Promise(res => setTimeout(res, delays[retryCount]));
            return fetchGeminiPrediction(userQuery, retryCount + 1);
          }
          throw error;
        }
      };

      const handlePredict = async () => {
        if (selectedDates.length === 0 || selectedTimes.length === 0 || (selectedLocs.length === 0 && !customLoc)) {
          alert("請至少選擇一個日期、時間與地點！");
          return;
        }
        
        setErrorMsg('');
        setAuthExpired(false);
        setIsPredicting(true);
        setShowResults(false);
        
        const datesStr = selectedDates.join('、');
        const timesStr = selectedTimes.map(getTimeLabel).join('、');
        const locsStr = [...selectedLocs.map(getLocLabel), customLoc].filter(Boolean).join('、');
        
        const userQuery = `請您以氣象預測專家的身分，綜合分析並預測以下時間與地點的「雲海與琉璃光」發生機率：
        日期：${datesStr}
        時段：${timesStr}
        地點：${locsStr}
        請仔細評估逆溫層、風向、濕度等條件，給出精確的機率與攝影建議。請務必以繁體中文回應。`;

        try {
          const aiResult = await fetchGeminiPrediction(userQuery);
          setPredictionData(aiResult);
          setShowResults(true);
        } catch (error) {
          if (error.message === 'AUTH_EXPIRED' || error.message.includes('400')) {
             setErrorMsg('API 金鑰無效或已失效。請檢查右上角設定中的 Google API Key 是否輸入正確。');
          } else if (error.message === 'ERROR_429') {
             setErrorMsg('API 請求次數已達上限 (429)。目前金鑰配額已耗盡，請稍候再試。');
          } else if (error.message === 'MISSING_KEY') {
             setErrorMsg('缺少 API 金鑰！請點擊右上角齒輪設定，填寫您的 Google API Key。');
             setShowApiSettings(true); // 自動展開設定
          } else {
             setErrorMsg(error.message || '抱歉，取得氣象分析資料時發生錯誤，請稍後再試。');
          }
        } finally {
          setIsPredicting(false);
        }
      };

      const getAnalysisIcon = (index) => {
        if (index % 2 === 0) return <Icon name="Thermometer" className="w-5 h-5 text-rose-500" />;
        return <Icon name="Wind" className="w-5 h-5 text-sky-500" />;
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-7xl mx-auto space-y-6">
            
            <header className="flex items-center justify-between mb-8">
              <div className="flex items-center space-x-4">
                <div className="p-3 bg-indigo-600 rounded-2xl shadow-lg shadow-indigo-200 text-white">
                  <Icon name="CloudFog" className="w-8 h-8" />
                </div>
                <div>
                  <h1 className="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">AI 氣象預測專家</h1>
                  <p className="text-slate-500 text-sm md:text-base mt-1">智能氣象分析・低空雲海與平流霧專屬攝影儀表板</p>
                </div>
              </div>
              <button 
                onClick={() => setShowApiSettings(!showApiSettings)}
                className="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-colors relative"
                title="進階系統設定"
              >
                <Icon name="Settings" className="w-6 h-6" />
                {!userApiKey && <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>}
                {!userApiKey && <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full"></span>}
              </button>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
              
              <div className="lg:col-span-4 space-y-6">
                
                {showApiSettings && (
                  <div className="bg-indigo-50 p-5 rounded-2xl border border-indigo-200 animate-in fade-in slide-in-from-top-2">
                    <h2 className="text-sm font-bold mb-3 flex items-center text-indigo-900">
                      <Icon name="Key" className="w-4 h-4 mr-2 text-indigo-600" /> API 金鑰設定 (必填)
                    </h2>
                    <div className="relative">
                      <input 
                        type="password" 
                        placeholder="請貼上您的 Google API Key"
                        value={userApiKey}
                        onChange={(e) => setUserApiKey(e.target.value)}
                        className="w-full pl-3 pr-4 py-2 bg-white border border-indigo-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-300"
                      />
                    </div>
                    <p className="text-[11px] text-indigo-500 mt-2 leading-relaxed">
                      因為本網頁架設於您的 GitHub Pages，系統無法提供預設金鑰，請務必輸入您的個人 Google Gemini API Key 才能運作。
                    </p>
                  </div>
                )}

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold mb-5 flex items-center border-b border-slate-100 pb-3 text-slate-800">
                    <Icon name="Calendar" className="w-5 h-5 mr-2 text-indigo-500" /> 觀測條件設定
                  </h2>
                  
                  <div className="mb-6">
                    <label className="block text-sm font-semibold text-slate-700 mb-3">目標日期 (可選擇多天)</label>
                    <div className="flex gap-2 mb-3">
                      <input
                        type="date"
                        value={dateInput}
                        onChange={(e) => setDateInput(e.target.value)}
                        className="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                      />
                      <button
                        onClick={handleAddDate}
                        className="px-4 py-2 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl text-sm font-bold hover:bg-indigo-100 transition-all transform active:scale-95"
                      >
                        新增
                      </button>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {selectedDates.length === 0 && (
                        <span className="text-sm text-slate-400">尚未選擇日期...</span>
                      )}
                      {selectedDates.map(date => (
                        <div
                          key={date}
                          className="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 text-white text-sm rounded-lg shadow-sm animate-in zoom-in duration-200"
                        >
                          <span className="font-medium tracking-wide">{date}</span>
                          <button 
                            onClick={() => handleRemoveDate(date)}
                            className="hover:bg-indigo-800 p-0.5 rounded-full transition-colors"
                          >
                            <Icon name="X" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="mb-6">
                    <label className="block text-sm font-semibold text-slate-700 mb-3">關鍵時段 (可複選)</label>
                    <div className="flex flex-col gap-3">
                      {timeOptions.map(time => (
                        <button
                          key={time.id}
                          onClick={() => toggleArrayItem(selectedTimes, setSelectedTimes, time.id)}
                          className={`flex items-center justify-between px-4 py-3 rounded-xl border transition-all duration-200 ${
                            selectedTimes.includes(time.id)
                              ? 'bg-indigo-600 border-indigo-600 text-white shadow-md font-medium'
                              : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300'
                          }`}
                        >
                          <span className="flex items-center gap-3"><Icon name={time.iconName} className="w-4 h-4" /> {time.label}</span>
                          {selectedTimes.includes(time.id) && <Icon name="CheckCircle2" className="w-5 h-5" />}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="mb-8">
                    <label className="block text-sm font-semibold text-slate-700 mb-3">觀測地點 (熱門標籤)</label>
                    <div className="flex flex-wrap gap-2 mb-4">
                      {locOptions.map(loc => (
                        <button
                          key={loc.id}
                          onClick={() => toggleArrayItem(selectedLocs, setSelectedLocs, loc.id)}
                          className={`px-3 py-1.5 text-sm rounded-lg transition-all duration-200 border ${
                            selectedLocs.includes(loc.id)
                              ? 'bg-sky-50 border-sky-200 text-sky-800 font-bold shadow-sm'
                              : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                          }`}
                        >
                          {loc.label}
                        </button>
                      ))}
                    </div>
                    <div className="relative">
                      <Icon name="MapPin" className="w-5 h-5 absolute left-3 top-2.5 text-slate-400" />
                      <input 
                        type="text" 
                        placeholder="或輸入自訂地點 (如: 觀音山)"
                        value={customLoc}
                        onChange={(e) => setCustomLoc(e.target.value)}
                        className="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-400"
                      />
                    </div>
                  </div>

                  <button 
                    onClick={handlePredict}
                    disabled={isPredicting || authExpired}
                    className="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed transform active:scale-[0.98]"
                  >
                    {isPredicting ? (
                      <><Icon name="Loader2" className="w-5 h-5 animate-spin" /> 啟動 AI 分析中...</>
                    ) : (
                      <><Icon name="CloudFog" className="w-5 h-5" /> 開始即時預測分析</>
                    )}
                  </button>
                  
                  {errorMsg && !authExpired && (
                    <div className="mt-4 p-4 bg-red-50 text-red-700 text-sm font-medium rounded-xl border border-red-200 flex items-start gap-3 shadow-sm animate-in fade-in">
                      <Icon name="AlertTriangle" className="w-5 h-5 shrink-0 mt-0.5" />
                      <span className="leading-relaxed">{errorMsg}</span>
                    </div>
                  )}
                </div>
              </div>

              <div className="lg:col-span-8">
                
                {!showResults && !isPredicting && !authExpired && (
                  <div className="h-full min-h-[500px] flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-3xl bg-slate-50/50">
                    <Icon name="CloudFog" className="w-20 h-20 mb-5 text-slate-300" />
                    <p className="text-xl font-bold text-slate-500">等待設定條件</p>
                    <p className="text-sm mt-2 text-slate-400">請在左側設定您想拍攝的日期與地點</p>
                    <p className="text-xs mt-1 text-slate-400">若為首次使用，請記得點擊右上角設定 API 金鑰</p>
                  </div>
                )}

                {isPredicting && !authExpired && (
                  <div className="h-full min-h-[500px] flex flex-col items-center justify-center text-indigo-500 space-y-6 bg-white rounded-3xl border border-slate-100 shadow-sm">
                    <div className="relative">
                      <div className="absolute inset-0 rounded-full blur-xl bg-indigo-200 animate-pulse"></div>
                      <Icon name="Loader2" className="w-14 h-14 animate-spin relative z-10 text-indigo-600" />
                    </div>
                    <div className="text-center">
                      <p className="font-bold text-lg animate-pulse text-indigo-900">正在分析氣象數據...</p>
                      <p className="text-sm text-indigo-500 mt-2">評估風速、濕度與逆溫層條件中，請稍候</p>
                    </div>
                  </div>
                )}

                {showResults && !authExpired && predictionData && (
                  <div className="space-y-6 animate-in fade-in slide-in-from-bottom-8 duration-700 fill-mode-both">
                    
                    <div className="bg-indigo-50 border border-indigo-100 p-5 md:p-6 rounded-2xl shadow-sm">
                      <div className="flex gap-4 items-start">
                        <Icon name="Info" className="w-6 h-6 text-indigo-500 shrink-0 mt-0.5" />
                        <p className="text-indigo-900 font-medium leading-relaxed text-sm md:text-base">
                          {predictionData.summary}
                        </p>
                      </div>
                    </div>

                    {predictionData.tableData && predictionData.tableData.length > 0 && (
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
                          📊 琉璃光與雲海發生機率預測
                        </h3>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead>
                              <tr className="border-b-2 border-slate-100 text-slate-500">
                                <th className="pb-3 font-semibold">時間 / 地點</th>
                                <th className="pb-3 font-semibold min-w-[150px]">發生機率</th>
                                <th className="pb-3 font-semibold">氣象因子簡評</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {predictionData.tableData.map((row, idx) => (
                                <tr key={idx} className="hover:bg-slate-50 transition-colors group">
                                  <td className="py-4 pr-4">
                                    <span className="block text-xs font-semibold text-indigo-400 mb-1">{row.time}</span>
                                    <span className="font-bold text-slate-700">{row.location}</span>
                                  </td>
                                  <td className="py-4 pr-4">
                                    <div className="flex items-center gap-3">
                                      <div className="w-24 md:w-32 h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                        <div 
                                          className={`h-full rounded-full transition-all duration-1000 ease-out ${row.probability >= 70 ? 'bg-emerald-500' : row.probability >= 40 ? 'bg-amber-400' : 'bg-red-400'}`}
                                          style={{ width: `${Math.max(0, Math.min(100, row.probability))}%` }}
                                        ></div>
                                      </div>
                                      <span className={`font-black ${row.probability >= 70 ? 'text-emerald-600' : row.probability >= 40 ? 'text-amber-600' : 'text-red-600'}`}>
                                        {row.probability}%
                                      </span>
                                    </div>
                                  </td>
                                  <td className="py-4 text-slate-600 font-medium truncate max-w-[200px] md:max-w-none group-hover:text-slate-900 transition-colors">
                                    {row.note}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {predictionData.analysis && predictionData.analysis.length > 0 && (
                        <div className="space-y-4">
                          <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            🔍 深度氣象判讀
                          </h3>
                          <div className="flex flex-col gap-4">
                            {predictionData.analysis.map((item, idx) => (
                              <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-200 transition-all">
                                <div className="flex items-center gap-3 mb-3">
                                  <div className="p-2 bg-slate-50 rounded-lg">
                                    {getAnalysisIcon(idx)}
                                  </div>
                                  <h4 className="font-bold text-slate-800 text-lg">{item.title}</h4>
                                </div>
                                <p className="text-sm text-slate-600 leading-relaxed font-medium">{item.content}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {predictionData.suggestions && predictionData.suggestions.length > 0 && (
                        <div className="space-y-4">
                          <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            📸 具體攝影建議
                          </h3>
                          <div className="flex flex-col gap-4">
                            {predictionData.suggestions.map((sug, idx) => (
                              <div key={idx} className="group bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all cursor-default relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <div className="flex justify-between items-start mb-2">
                                  <h4 className="font-bold text-indigo-700 flex items-center gap-1.5 text-base">
                                    <Icon name="MapPin" className="w-4 h-4" /> {sug.loc}
                                  </h4>
                                  {sug.alt && (
                                    <span className="text-xs font-bold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-md">{sug.alt}</span>
                                  )}
                                </div>
                                {sug.time && (
                                  <p className="text-xs text-indigo-500 mb-2.5 font-bold bg-indigo-50 inline-block px-2 py-1 rounded">首選時段: {sug.time}</p>
                                )}
                                <p className="text-sm text-slate-600 leading-relaxed font-medium">{sug.desc}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    {predictionData.tips && predictionData.tips.length > 0 && (
                      <div className="bg-amber-50 border-l-4 border-amber-500 p-5 md:p-6 rounded-r-2xl rounded-l-sm shadow-sm">
                        <div className="flex gap-4">
                          <Icon name="AlertTriangle" className="w-6 h-6 text-amber-500 shrink-0 mt-0.5" />
                          <div>
                            <h4 className="font-bold text-amber-900 mb-3 text-lg">💡 專家觀測貼士</h4>
                            <ul className="space-y-2">
                              {predictionData.tips.map((tip, idx) => {
                                const hasColon = tip.includes('：') || tip.includes(':');
                                if(hasColon) {
                                  const splitChar = tip.includes('：') ? '：' : ':';
                                  const parts = tip.split(splitChar);
                                  const title = parts[0];
                                  const desc = parts.slice(1).join(splitChar);
                                  return (
                                    <li key={idx} className="text-sm text-amber-800 flex items-start gap-2">
                                      <Icon name="ChevronRight" className="w-4 h-4 shrink-0 mt-0.5 opacity-60 text-amber-600" />
                                      <span>
                                        <strong className="font-bold">{title}：</strong>
                                        <span className="font-medium opacity-90">{desc}</span>
                                      </span>
                                    </li>
                                  );
                                } else {
                                  return (
                                    <li key={idx} className="text-sm text-amber-800 flex items-start gap-2">
                                      <Icon name="ChevronRight" className="w-4 h-4 shrink-0 mt-0.5 opacity-60 text-amber-600" />
                                      <span className="font-medium opacity-90">{tip}</span>
                                    </li>
                                  );
                                }
                              })}
                            </ul>
                          </div>
                        </div>
                      </div>
                    )}

                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 將 React 元件掛載到 HTML 上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
