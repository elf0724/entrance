<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 東京・沼津・大洗 雙人行旅手冊</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone (JSX 轉譯) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- 內嵌 SVG 圖示元件 (無需外部 Lucide 庫) ---
    const Icon = ({ path, className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {path}
      </svg>
    );

    const Icons = {
      Plane: ({ className }) => <Icon className={className} path={<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>} />,
      Train: ({ className }) => <Icon className={className} path={<><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></>} />,
      MapPin: ({ className }) => <Icon className={className} path={<><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></>} />,
      Clock: ({ className }) => <Icon className={className} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
      Luggage: ({ className }) => <Icon className={className} path={<><path d="M6 20h0a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2"/><path d="M8 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14"/><circle cx="8" cy="20" r="2"/><circle cx="16" cy="20" r="2"/></>} />,
      Camera: ({ className }) => <Icon className={className} path={<><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>} />,
      Utensils: ({ className }) => <Icon className={className} path={<><path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/><path d="M15 2v19"/><path d="M6 2v20"/><path d="M9 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/></>} />,
      Sparkles: ({ className }) => <Icon className={className} path={<><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></>} />,
      CheckCircle2: ({ className }) => <Icon className={className} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />,
      Circle: ({ className }) => <Icon className={className} path={<circle cx="12" cy="12" r="10"/>} />,
      AlertTriangle: ({ className }) => <Icon className={className} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
      Users: ({ className }) => <Icon className={className} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />,
      User: ({ className }) => <Icon className={className} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
      Building2: ({ className }) => <Icon className={className} path={<><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></>} />,
      Waves: ({ className }) => <Icon className={className} path={<><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></>} />,
      ChevronRight: ({ className }) => <Icon className={className} path={<polyline points="9 18 15 12 9 6"/>} />,
      Ticket: ({ className }) => <Icon className={className} path={<><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></>} />,
      Bath: ({ className }) => <Icon className={className} path={<><path d="M9 6 6.5 3.5a1.5 1.5 0 0 0-1-.5C4.68 3 4 3.68 4 4.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><line x1="10" y1="5" x2="8" y2="7"/><line x1="2" y1="12" x2="22" y2="12"/></>} />
    };

    // --- 資料集定義 ---
    const TRIP_DATA = {
      title: '2026 東京・沼津・大洗',
      subtitle: '雙人自助行旅隨身手冊',
      dates: '2026.11.13 (五) – 11.16 (一)',
      flights: [
        {
          type: '去程',
          date: '11/13 (五)',
          code: '樂桃 MM860',
          depTime: '20:55',
          depAirport: '桃園機場 T1',
          arrTime: '00:50 (+1)',
          arrAirport: '羽田機場 T3',
          baggageNote: '18:25 開櫃 / 20:05 關櫃（建議 19:30 前抵櫃檯託運小行李箱）'
        },
        {
          type: '回程',
          date: '11/16 (一)',
          code: '樂桃 MM859',
          depTime: '05:45',
          depAirport: '羽田機場 T3',
          arrTime: '08:55',
          arrAirport: '桃園機場 T1',
          baggageNote: '03:45 開櫃 / 04:55 關櫃（搭平和島 03:10 接駁車，03:40 抵機場）'
        }
      ],
      accommodations: [
        {
          night: 'Day 1｜11/13 (五) 深夜',
          name: '天然溫泉 平和島',
          price: '¥5,000 / 人',
          note: '24小時營業、大浴場泡湯與躺椅休息；含 11/14 07:00 早餐',
          mapQuery: '天然温泉 平和島'
        },
        {
          night: 'Day 2｜11/14 (六) 晚間',
          name: '天然溫泉 香梅之湯 多美迎水戶 (Dormy Inn Mito)',
          price: '¥15,390 / 人',
          note: '同事已代墊；頂樓天然溫泉、免費夜鳴拉麵；11/15 退房後行李寄放櫃檯',
          mapQuery: 'ドーミーイン水戸'
        },
        {
          night: 'Day 3｜11/15 (日) 晚間',
          name: '天然溫泉 平和島',
          price: '¥5,000 / 人',
          note: '躺椅休息；11/16 凌晨 03:00 退房，搭 03:10 免費接駁車赴羽田機場',
          mapQuery: '天然温泉 平和島'
        }
      ]
    };

    const INITIAL_CHECKLIST = [
      { id: 'c1', text: '11/13 (五) 19:30 前抵達桃機第一航廈，完成小行李箱託運（20:05 關櫃）', done: false },
      { id: 'c2', text: '11/14 (六) 08:25 品川站分流前，確認下午 15:45 常磐線特急車票由誰保管', done: false },
      { id: 'c3', text: '11/14 (六) 14:35 前先從品川置物櫃領出行李箱，15:00 刷進 JR 改札內等同事', done: false },
      { id: 'c4', text: '11/14 (六) 15:15 約在「JR 品川站中央改札口內側」會合（兩人都不要刷出站）', done: false },
      { id: 'c5', text: '11/15 (日) 08:40 多美迎水戶退房後，將小行李箱寄放在飯店一樓櫃檯', done: false },
      { id: 'c6', text: '11/15 (日) 09:00 水戶站搭大洗鹿島線「不可刷 Suica」，需在售票機買紙本票 (來回 ¥840)', done: false },
      { id: 'c7', text: '11/16 (一) 03:00 平和島退房、搭 03:10 接駁巴士，03:45 羽田 T3 開櫃託運行李', done: false }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('day2');
      const [viewMode, setViewMode] = useState('all'); // 'all' | 'me' | 'colleague'
      const [shinagawaRoute, setShinagawaRoute] = useState('routeA'); // 'routeA' | 'routeB'
      const [checklist, setChecklist] = useState(INITIAL_CHECKLIST);

      const toggleCheck = (id) => {
        setChecklist((prev) =>
          prev.map((item) => (item.id === id ? { ...item, done: !item.done } : item))
        );
      };

      const completedCount = useMemo(() => checklist.filter((i) => i.done).length, [checklist]);

      const openMap = (query) => {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 pb-24 font-sans">
          {/* Top Hero Header */}
          <header className="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white pt-6 pb-5 px-4 shadow-lg sticky top-0 z-30">
            <div className="max-w-2xl mx-auto">
              <div className="flex items-center justify-between">
                <div>
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-500/20 text-indigo-200 border border-indigo-400/30 mb-1.5">
                    <Icons.Sparkles className="w-3.5 h-3.5 text-amber-300" />
                    {TRIP_DATA.dates}
                  </span>
                  <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white">
                    {TRIP_DATA.title}
                  </h1>
                  <p className="text-xs sm:text-sm text-slate-300 mt-0.5">
                    {TRIP_DATA.subtitle}｜品川彈性分流・大洗全程同行版
                  </p>
                </div>
                <div className="text-right bg-white/10 backdrop-blur-md rounded-xl p-2.5 border border-white/10">
                  <div className="text-[11px] text-slate-300">檢核進度</div>
                  <div className="text-lg font-bold text-amber-300">
                    {completedCount} <span className="text-xs text-slate-300 font-normal">/ {checklist.length}</span>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="grid grid-cols-5 gap-1.5 mt-4 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
                {[
                  { id: 'day1', label: '11/13', sub: 'Day 1 啟程' },
                  { id: 'day2', label: '11/14', sub: 'Day 2 分流' },
                  { id: 'day3', label: '11/15', sub: 'Day 3 大洗' },
                  { id: 'day4', label: '11/16', sub: 'Day 4 返台' },
                  { id: 'info', label: '總覽', sub: '航班/檢核' }
                ].map((tab) => {
                  const active = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`py-2 px-1 rounded-lg text-center transition-all duration-200 ${
                        active
                          ? 'bg-indigo-600 text-white shadow-md font-semibold'
                          : 'text-slate-300 hover:bg-slate-700/50'
                      }`}
                    >
                      <div className="text-xs sm:text-sm leading-tight">{tab.label}</div>
                      <div className={`text-[10px] mt-0.5 ${active ? 'text-indigo-100' : 'text-slate-400'}`}>
                        {tab.sub}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-2xl mx-auto px-3 sm:px-4 pt-4 space-y-4">
            {/* ================= DAY 1: 11/13 (五) ================= */}
            {activeTab === 'day1' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                      Day 1｜2026年11月13日（週五）
                    </span>
                    <span className="text-xs text-slate-500 flex items-center gap-1">
                      <Icons.Users className="w-3.5 h-3.5 text-indigo-600" /> 全程共同行動
                    </span>
                  </div>
                  <h2 className="text-lg font-bold text-slate-800">
                    下班直奔桃園機場 ➔ 深夜抵達羽田 ➔ 平和島溫泉休息
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    重點：你有買來回託運行李，請務必於 19:30 前抵達桃機第一航廈樂桃櫃檯完成託運。
                  </p>
                </div>

                <div className="space-y-3">
                  <TimelineCard
                    time="18:30 – 19:30"
                    badge="共同行動"
                    badgeColor="indigo"
                    icon={<Icons.Luggage className="w-4 h-4" />}
                    title="下班出發 ➔ 桃園機場第一航廈會合報到"
                    desc="樂桃 MM860 於 18:25 開櫃、20:05 關櫃。先將你的小行李箱辦理託運，一身輕便入關。入關後買頂呱呱或簡餐當晚餐。"
                    mapQuery="桃園國際機場第一航廈"
                    onOpenMap={openMap}
                  />

                  <TimelineCard
                    time="20:55 – 00:50 (+1)"
                    badge="航班 MM860"
                    badgeColor="amber"
                    icon={<Icons.Plane className="w-4 h-4" />}
                    title="搭乘樂桃航空 MM860 飛往東京羽田 (T3)"
                    desc="飛行時間約 2 小時 55 分鐘。可在機上先補眠休息，準備迎接深夜入境。"
                  />

                  <TimelineCard
                    time="00:50 – 01:40"
                    badge="深夜入境"
                    badgeColor="indigo"
                    icon={<Icons.Luggage className="w-4 h-4" />}
                    title="抵達羽田機場第 3 航廈 ➔ 領取託運行李"
                    desc="出關並領取你的託運行李箱後，前往搭乘深夜接駁巴士（或計程車約 15 分鐘）前往平和島溫泉。"
                    mapQuery="羽田空港第3ターミナル"
                    onOpenMap={openMap}
                  />

                  <TimelineCard
                    time="02:00 – 07:00"
                    badge="溫泉休息"
                    badgeColor="emerald"
                    icon={<Icons.Bath className="w-4 h-4" />}
                    title="入住「天然溫泉 平和島」泡湯與躺椅補眠"
                    desc="費用約 ¥5,000（含早上 7:00 早餐，可刷卡或付現）。先泡個天然溫泉洗去疲勞，再到躺椅休息區好好睡一覺。"
                    mapQuery="天然温泉 平和島"
                    onOpenMap={openMap}
                  />
                </div>
              </div>
            )}

            {/* ================= DAY 2: 11/14 (六) ================= */}
            {activeTab === 'day2' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md">
                      Day 2｜2026年11月14日（週六）
                    </span>
                    <span className="text-xs font-medium text-amber-700 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200">
                      ★ 08:25 – 15:15 品川雙軌分流日
                    </span>
                  </div>
                  <h2 className="text-lg font-bold text-slate-800">
                    品川半日自由放空 vs. 沼津聖地特攻 ➔ 下午會合前往水戶
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    切換下方視角按鈕，可單獨檢視「你的品川漫遊路線」或「雙人並排對照」。
                  </p>

                  {/* 視角切換器 */}
                  <div className="grid grid-cols-3 gap-1.5 mt-3 bg-slate-100 p-1 rounded-xl">
                    <button
                      onClick={() => setViewMode('all')}
                      className={`flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold transition-all ${
                        viewMode === 'all'
                          ? 'bg-white text-slate-900 shadow-sm'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icons.Users className="w-3.5 h-3.5 text-indigo-600" />
                      雙人對照
                    </button>
                    <button
                      onClick={() => setViewMode('me')}
                      className={`flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold transition-all ${
                        viewMode === 'me'
                          ? 'bg-emerald-600 text-white shadow-sm'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icons.Camera className="w-3.5 h-3.5" />
                      只看我的路線
                    </button>
                    <button
                      onClick={() => setViewMode('colleague')}
                      className={`flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold transition-all ${
                        viewMode === 'colleague'
                          ? 'bg-amber-600 text-white shadow-sm'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icons.User className="w-3.5 h-3.5" />
                      只看同事路線
                    </button>
                  </div>
                </div>

                {/* 早晨共同出發 */}
                <TimelineCard
                  time="07:00 – 08:25"
                  badge="共同行動"
                  badgeColor="indigo"
                  icon={<Icons.Train className="w-4 h-4" />}
                  title="平和島早餐退房 ➔ 搭京急線前往品川站"
                  desc="07:00 享用溫泉早餐 ➔ 07:40 搭公車 (¥100) 至京急平和島站 ➔ 07:53 搭京急本線 (¥180) ➔ 約 08:15–08:25 抵達品川站。"
                  mapQuery="品川駅"
                  onOpenMap={openMap}
                />

                {/* 分流提醒 */}
                <div className="bg-amber-50 border-l-4 border-amber-500 rounded-r-2xl p-3.5 shadow-sm">
                  <div className="flex items-start gap-2.5">
                    <Icons.AlertTriangle className="w-5 h-5 text-amber-600 shrink-0 mt-0.5" />
                    <div>
                      <div className="text-xs font-bold text-amber-900">
                        🔔 上午分流點：08:25 JR 品川站改札口內
                      </div>
                      <p className="text-xs text-amber-800 mt-1 leading-relaxed">
                        分開前請務必確認：下午 <strong>15:45 品川往水戶的「JR 常磐線特急指定席車票」</strong> 是在誰身上，並約好下午 <strong>15:15 直接在 JR 品川站中央改札口「內側」</strong>會合！
                      </p>
                    </div>
                  </div>
                </div>

                {/* 分流內容展示 */}
                <div className={`grid gap-3 ${viewMode === 'all' ? 'md:grid-cols-2' : 'grid-cols-1'}`}>
                  {/* 我的路線 */}
                  {(viewMode === 'all' || viewMode === 'me') && (
                    <div className="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-4 space-y-3 shadow-sm">
                      <div className="flex items-center justify-between border-b border-emerald-200/80 pb-2.5">
                        <div className="flex items-center gap-2">
                          <span className="p-1.5 rounded-lg bg-emerald-600 text-white">
                            <Icons.Camera className="w-4 h-4" />

                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <Icons.CheckCircle2 className="w-5 h-5 text-emerald-600" />
                      <h2 className="text-base font-bold text-slate-800">旅途關鍵行動檢核表</h2>
                    </div>
                    <span className="text-xs text-slate-500">點擊即可打勾記錄</span>
                  </div>

                  <div className="space-y-2">
                    {checklist.map((item) => (
                      <button
                        key={item.id}
                        onClick={() => toggleCheck(item.id)}
                        className={`w-full text-left p-3 rounded-xl border transition-all flex items-start gap-2.5 ${
                          item.done
                            ? 'bg-emerald-50/50 border-emerald-200 text-slate-400 line-through'
                            : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-700'
                        }`}
                      >
                        {item.done ? (
                          <Icons.CheckCircle2 className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                        ) : (
                          <Icons.Circle className="w-4 h-4 text-slate-400 shrink-0 mt-0.5" />
                        )}
                        <span className="text-xs leading-relaxed font-medium">{item.text}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                  <div className="flex items-center gap-2">
                    <Icons.Building2 className="w-5 h-5 text-indigo-600" />
                    <h2 className="text-base font-bold text-slate-800">三晚住宿與休息據點</h2>
                  </div>
                  <div className="space-y-2.5">
                    {TRIP_DATA.accommodations.map((acc, i) => (
                      <div
                        key={i}
                        className="p-3 rounded-xl bg-slate-50 border border-slate-200/80 flex items-start justify-between gap-2"
                      >
                        <div className="space-y-1">
                          <div className="text-[11px] font-bold text-indigo-600">{acc.night}</div>
                          <div className="text-sm font-bold text-slate-800">{acc.name}</div>
                          <div className="text-xs text-slate-600">{acc.note}</div>
                          <div className="text-xs font-semibold text-amber-700">預算：{acc.price}</div>
                        </div>
                        <MapButton label="地圖" onClick={() => openMap(acc.mapQuery)} />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Floating Quick Bar */}
          <footer className="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 px-4 z-20">
            <div className="max-w-2xl mx-auto flex items-center justify-between text-xs">
              <div className="flex items-center gap-2 text-slate-600">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                <span>
                  {activeTab === 'day2'
                    ? '11/14 15:15 品川改札內會合'
                    : activeTab === 'day3'
                    ? '大洗鹿島線需買紙本車票'
                    : '樂桃託運：起飛前 50 分鐘關櫃'}
                </span>
              </div>
              <button
                onClick={() => setActiveTab('info')}
                className="text-indigo-600 font-semibold hover:underline flex items-center gap-0.5"
              >
                檢核表 ({completedCount}/{checklist.length})
                <Icons.ChevronRight className="w-3.5 h-3.5" />
              </button>
            </div>
          </footer>
        </div>
      );
    }

    function TimelineCard({ time, badge, badgeColor, icon, title, desc, mapQuery, onOpenMap }) {
      const colorMap = {
        indigo: 'bg-indigo-50 text-indigo-700 border-indigo-200',
        emerald: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        amber: 'bg-amber-50 text-amber-800 border-amber-200'
      };

      return (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 hover:border-slate-300 transition-all">
          <div className="flex items-center justify-between gap-2 mb-1.5">
            <div className="flex items-center gap-1.5 text-xs font-bold text-slate-700">
              <Icons.Clock className="w-3.5 h-3.5 text-slate-400" />
              {time}
            </div>
            <span
              className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold border ${
                colorMap[badgeColor] || colorMap.indigo
              }`}
            >
              {icon}
              {badge}
            </span>
          </div>
          <h3 className="text-sm sm:text-base font-bold text-slate-900">{title}</h3>
          <p className="text-xs text-slate-600 mt-1 leading-relaxed">{desc}</p>
          {mapQuery && (
            <div className="mt-2.5">
              <MapButton label={`導航：${mapQuery}`} onClick={() => onOpenMap(mapQuery)} />
            </div>
          )}
        </div>
      );
    }

    function MapButton({ label, onClick }) {
      return (
        <button
          onClick={onClick}
          className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 border border-slate-200/80 transition-colors"
        >
          <Icons.MapPin className="w-3 h-3 text-indigo-600" />
          {label}
        </button>
      );
    }

    // 啟動應用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
